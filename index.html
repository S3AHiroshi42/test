        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffd900",
                        "primary-dim": "#ccad00",
                        "secondary": "#ffb6c1",
                        "background-light": "#f8f8f5",
                        "background-dark": "#23200f",

                        "surface-darker": "#1a180b",
                        "surface-light": "#ffffff",
                        "text-dark": "#333333",
                        "text-gray": "#666666"
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},

                        "soft": "0 4px 20px -2px rgba(230, 247, 255, 0.5)",

                    }

        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

            -ms-overflow-style: none;

        }

            min-height: max(884px, 100dvh);

                <div class="absolute right-0 top-0 w-32 h-32 bg-primary/10 dark:bg-primary/5 rounded-bl-full -mr-4 -mt-4"></div>

                    <div>

                    </div>

                    <div>

    <!-- Bottom Navigation -->

        <div class="flex justify-between items-center">
            <button class="flex flex-col items-center gap-1 text-primary w-12 relative">
                <span class="absolute -top-6 w-8 h-1 bg-primary rounded-b-lg shadow-[0_0_10px_rgba(255,217,0,0.6)]"></span>
                <span class="material-icons-round text-2xl">home</span>
                <span class="text-[10px] font-medium">首頁</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-500 hover:text-primary transition-colors group w-12">

                <span class="text-[10px] font-medium">遊戲</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-500 hover:text-primary transition-colors group w-12">
                <span class="material-icons-round text-2xl group-hover:scale-110 transition-transform">leaderboard</span>
                <span class="text-[10px] font-medium">排名</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-400 dark:text-gray-500 hover:text-primary transition-colors group w-12">

                    <img class="w-full h-full object-cover" alt="user avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80">

    <script>
        // Theme toggle functionality
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        
        themeToggle.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        // Check for saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            htmlElement.classList.remove('dark');
        } else if (savedTheme === 'dark') {
            htmlElement.classList.add('dark');
        }

        // Simple search functionality
        const searchInput = document.getElementById('searchInput');
        const gameCards = document.querySelectorAll('.game-card');
        
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                
                gameCards.forEach(card => {
                    const gameName = card.querySelector('h3').textContent.toLowerCase();
                    const gameDescription = card.querySelector('p').textContent.toLowerCase();
                    
                    if (gameName.includes(searchTerm) || gameDescription.includes(searchTerm)) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        }

        // Category filter functionality
        const categoryButtons = document.querySelectorAll('.category-btn');
        
        categoryButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Remove active class from all buttons
                categoryButtons.forEach(btn => {
                    btn.classList.remove('bg-primary', 'text-background-dark', 'shadow-lg', 'shadow-primary/20');
                    btn.classList.add('bg-white', 'dark:bg-surface-dark', 'border', 'border-gray-200', 'dark:border-white/5', 'text-gray-600', 'dark:text-gray-300');
                });
                
                // Add active class to clicked button
                button.classList.add('bg-primary', 'text-background-dark', 'shadow-lg', 'shadow-primary/20');
                button.classList.remove('bg-white', 'dark:bg-surface-dark', 'border', 'border-gray-200', 'dark:border-white/5', 'text-gray-600', 'dark:text-gray-300');
                
                const category = button.dataset.category;
                
                // Filter games
                gameCards.forEach(card => {
                    if (category === 'all') {
                        card.style.display = 'block';
                    } else {
                        const cardCategory =
