<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圓圈交叉遊戲</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }
        
        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            color: #ddd;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        
        .game-container {
            position: relative;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .player-selection {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .player-btn {
            background: rgba(255,255,255,0.1);
            border: 3px solid rgba(255,255,255,0.3);
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .player-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-3px);
        }
        
        .player-btn.selected {
            background: rgba(255,255,255,0.3);
            border-color: #4CAF50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
        }
        
        .circle-icon {
            width: 30px;
            height: 30px;
            border: 3px solid #4CAF50;
            border-radius: 50%;
        }
        
        .cross-icon {
            width: 30px;
            height: 30px;
            position: relative;
        }
        
        .cross-icon::before,
        .cross-icon::after {
            content: '';
            position: absolute;
            background: #FF4444;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
        }
        
        .cross-icon::before {
            width: 4px;
            height: 30px;
        }
        
        .cross-icon::after {
            width: 30px;
            height: 4px;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 300px;
            height: 300px;
            margin: 0 auto;
        }
        
        .cell {
            background: rgba(255,255,255,0.1);
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            transition: all 0.3s ease;
        }
        
        .cell:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }
        
        .cell.circle {
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
            border-color: #4CAF50;
        }
        
        .cell.cross {
            color: #FF4444;
            background: rgba(255, 68, 68, 0.1);
            border-color: #FF4444;
        }
        
        .score-container {
            background: rgba(255,255,255,0.1);
            padding: 15px 30px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            width: 100%;
            max-width: 600px;
            border: 2px solid rgba(255,255,255,0.2);
            display: flex;
            justify-content: space-around;
        }
        
        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .score {
            font-size: 2rem;
            font-weight: bold;
            color: #4CAF50;
        }
        
        .score-box.cross .score {
            color: #FF4444;
        }
        
        .current-player {
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-align: center;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }
        
        .current-player .circle-icon,
        .current-player .cross-icon {
            display: inline-block;
            vertical-align: middle;
            margin: 0 5px;
        }
        
        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            z-index: 10;
        }
        
        .game-over h2 {
            color: #4CAF50;
            font-size: 3rem;
            margin-bottom: 20px;
        }
        
        .game-over .winner-icon {
            width: 80px;
            height: 80px;
            margin: 20px 0;
        }
        
        .game-over p {
            font-size: 1.5rem;
            margin: 10px 0;
            color: #fff;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            width: 100%;
        }
        
        button {
            background: linear-gradient(to bottom, #4CAF50, #2E7D32);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        button:hover {
            background: linear-gradient(to bottom, #66BB6A, #388E3C);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        #newGameBtn {
            background: linear-gradient(to bottom, #2196F3, #1976D2);
        }
        
        #newGameBtn:hover {
            background: linear-gradient(to bottom, #42A5F5, #1E88E5);
        }
        
        .winning-line {
            position: absolute;
            background: rgba(255, 215, 0, 0.8);
            border-radius: 5px;
            z-index: 1;
        }
        
        @media (max-width: 500px) {
            .game-board {
                width: 250px;
                height: 250px;
            }
            
            .player-selection {
                flex-direction: column;
                align-items: center;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>圓圈交叉遊戲</h1>
        <p class="subtitle">選擇你的棋子，在3×3的棋盤上連成一線！</p>
    </div>
    
    <div class="game-container">
        <div class="player-selection" id="playerSelection">
            <button class="player-btn" id="selectCircleBtn">
                <div class="circle-icon"></div>
                控制圓圈
            </button>
            <button class="player-btn" id="selectCrossBtn">
                <div class="cross-icon"></div>
                控制交叉
            </button>
        </div>
        
        <div class="current-player" id="currentPlayerDisplay">
            當前玩家: <span id="currentPlayerIcon"></span>
        </div>
        
        <div class="game-board" id="gameBoard">
            <!-- 棋盤格子將會由JavaScript生成 -->
        </div>
        
        <div class="game-over" id="gameOverScreen">
            <h2 id="gameResult">遊戲結束！</h2>
            <div id="winnerIcon" class="winner-icon"></div>
            <p id="winnerMessage"></p>
            <div class="controls">
                <button id="playAgainBtn">再玩一局</button>
                <button id="resetGameBtn">重新選擇</button>
            </div>
        </div>
    </div>
    
    <div class="score-container">
        <div class="score-box circle">
            <div class="circle-icon"></div>
            <div>圓圈</div>
            <div class="score" id="circleScore">0</div>
        </div>
        <div class="score-box">
            <div>平局</div>
            <div class="score" id="drawScore">0</div>
        </div>
        <div class="score-box cross">
            <div class="cross-icon"></div>
            <div>交叉</div>
            <div class="score" id="crossScore">0</div>
        </div>
    </div>
    
    <div class="controls">
        <button id="newGameBtn">全新遊戲</button>
    </div>

    <script>
        // 遊戲變數
        let currentPlayer = 'circle'; // 'circle' 或 'cross'
        let gameBoard = Array(9).fill('');
        let gameActive = false;
        let playerChoice = null;
        let scores = {
            circle: 0,
            cross: 0,
            draw: 0
        };
        
        // 獲勝組合
        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // 橫排
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // 直排
            [0, 4, 8], [2, 4, 6]             // 對角線
        ];
        
        // DOM元素
        const playerSelection = document.getElementById('playerSelection');
        const selectCircleBtn = document.getElementById('selectCircleBtn');
        const selectCrossBtn = document.getElementById('selectCrossBtn');
        const gameBoardElement = document.getElementById('gameBoard');
        const currentPlayerDisplay = document.getElementById('currentPlayerDisplay');
        const currentPlayerIcon = document.getElementById('currentPlayerIcon');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const gameResult = document.getElementById('gameResult');
        const winnerMessage = document.getElementById('winnerMessage');
        const winnerIcon = document.getElementById('winnerIcon');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const resetGameBtn = document.getElementById('resetGameBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const circleScore = document.getElementById('circleScore');
        const crossScore = document.getElementById('crossScore');
        const drawScore = document.getElementById('drawScore');
        
        // 初始化遊戲
        function initGame() {
            gameBoard = Array(9).fill('');
            gameActive = false;
            currentPlayer = 'circle';
            
            // 載入分數
            const savedScores = localStorage.getItem('ticTacToeScores');
            if (savedScores) {
                scores = JSON.parse(savedScores);
                updateScoreDisplay();
            }
            
            // 生成棋盤格子
            gameBoardElement.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.addEventListener('click', () => makeMove(i));
                gameBoardElement.appendChild(cell);
            }
            
            // 顯示玩家選擇界面
            playerSelection.style.display = 'flex';
            currentPlayerDisplay.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            // 移除之前的獲勝線
            document.querySelectorAll('.winning-line').forEach(el => el.remove());
        }
        
        // 選擇玩家角色
        function selectPlayer(choice) {
            playerChoice = choice;
            gameActive = true;
            
            // 更新選擇按鈕狀態
            selectCircleBtn.classList.toggle('selected', choice === 'circle');
            selectCrossBtn.classList.toggle('selected', choice === 'cross');
            
            // 隱藏選擇界面，顯示遊戲界面
            playerSelection.style.display = 'none';
            currentPlayerDisplay.style.display = 'block';
            
            // 設置當前玩家圖標
            updateCurrentPlayerDisplay();
        }
        
        // 更新當前玩家顯示
        function updateCurrentPlayerDisplay() {
            if (currentPlayer === 'circle') {
                currentPlayerIcon.innerHTML = '<div class="circle-icon" style="width:20px;height:20px;"></div>';
            } else {
                currentPlayerIcon.innerHTML = '<div class="cross-icon" style="width:20px;height:20px;"></div>';
            }
        }
        
        // 下棋
        function makeMove(index) {
            if (!gameActive || gameBoard[index] !== '') return;
            
            // 在棋盤上標記
            gameBoard[index] = currentPlayer;
            
            // 更新界面
            const cell = document.querySelector(`.cell[data-index="${index}"]`);
            cell.classList.add(currentPlayer);
            
            if (currentPlayer === 'circle') {
                cell.innerHTML = '<div class="circle-icon"></div>';
            } else {
                cell.innerHTML = '<div class="cross-icon"></div>';
            }
            
            // 檢查遊戲結果
            const result = checkGameResult();
            
            if (result === 'win') {
                endGame(currentPlayer);
            } else if (result === 'draw') {
                endGame('draw');
            } else {
                // 切換玩家
                currentPlayer = currentPlayer === 'circle' ? 'cross' : 'circle';
                updateCurrentPlayerDisplay();
            }
        }
        
        // 檢查遊戲結果
        function checkGameResult() {
            // 檢查是否有玩家獲勝
            for (const pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (gameBoard[a] !== '' && 
                    gameBoard[a] === gameBoard[b] && 
                    gameBoard[a] === gameBoard[c]) {
                    
                    // 繪製獲勝線
                    drawWinningLine(pattern);
                    return 'win';
                }
            }
            
            // 檢查是否平局
            if (!gameBoard.includes('')) {
                return 'draw';
            }
            
            return 'continue';
        }
        
        // 繪製獲勝線
        function drawWinningLine(pattern) {
            const [a, b, c] = pattern;
            const cells = document.querySelectorAll('.cell');
            
            const cell1 = cells[a].getBoundingClientRect();
            const cell3 = cells[c].getBoundingClientRect();
            const boardRect = gameBoardElement.getBoundingClientRect();
            
            const line = document.createElement('div');
            line.className = 'winning-line';
            
            // 計算線的位置和尺寸
            if (pattern[0] === 0 && pattern[2] === 2) {
                // 第一橫排
                line.style.width = 'calc(100% - 20px)';
                line.style.height = '6px';
                line.style.top = `calc(33.33% / 2 - 3px)`;
                line.style.left = '10px';
            } else if (pattern[0] === 3 && pattern[2] === 5) {
                // 第二橫排
                line.style.width = 'calc(100% - 20px)';
                line.style.height = '6px';
                line.style.top = `calc(50% - 3px)`;
                line.style.left = '10px';
            } else if (pattern[0] === 6 && pattern[2] === 8) {
                // 第三橫排
                line.style.width = 'calc(100% - 20px)';
                line.style.height = '6px';
                line.style.top = `calc(83.33% - 3px)`;
                line.style.left = '10px';
            } else if (pattern[0] === 0 && pattern[2] === 6) {
                // 第一直排
                line.style.width = '6px';
                line.style.height = 'calc(100% - 20px)';
                line.style.top = '10px';
                line.style.left = `calc(16.66% - 3px)`;
            } else if (pattern[0] === 1 && pattern[2] === 7) {
                // 第二直排
                line.style.width = '6px';
                line.style.height = 'calc(100% - 20px)';
                line.style.top = '10px';
                line.style.left = `calc(50% - 3px)`;
            } else if (pattern[0] === 2 && pattern[2] === 8) {
                // 第三直排
                line.style.width = '6px';
                line.style.height = 'calc(100% - 20px)';
                line.style.top = '10px';
                line.style.left = `calc(83.33% - 3px)`;
            } else if (pattern[0] === 0 && pattern[2] === 8) {
                // 對角線（左上到右下）
                line.style.width = 'calc(141.42% - 20px)';
                line.style.height = '6px';
                line.style.top = 'calc(50% - 3px)';
                line.style.left = '-20.71%';
                line.style.transform = 'rotate(45deg)';
            } else if (pattern[0] === 2 && pattern[2] === 6) {
                // 對角線（右上到左下）
                line.style.width = 'calc(141.42% - 20px)';
                line.style.height = '6px';
                line.style.top = 'calc(50% - 3px)';
                line.style.left = '-20.71%';
                line.style.transform = 'rotate(-45deg)';
            }
            
            gameBoardElement.appendChild(line);
        }
        
        // 結束遊戲
        function endGame(result) {
            gameActive = false;
            
            // 更新分數
            if (result === 'circle' || result === 'cross') {
                scores[result]++;
                winnerMessage.textContent = `${result === 'circle' ? '圓圈' : '交叉'} 獲勝！`;
                
                if (result === 'circle') {
                    winnerIcon.innerHTML = '<div class="circle-icon"></div>';
                    gameResult.style.color = '#4CAF50';
                } else {
                    winnerIcon.innerHTML = '<div class="cross-icon"></div>';
                    gameResult.style.color = '#FF4444';
                }
            } else {
                scores.draw++;
                winnerMessage.textContent = '平局！';
                winnerIcon.innerHTML = '';
                gameResult.style.color = '#FFD700';
            }
            
            // 更新分數顯示
            updateScoreDisplay();
            
            // 儲存分數
            localStorage.setItem('ticTacToeScores', JSON.stringify(scores));
            
            // 顯示遊戲結束畫面
            gameOverScreen.style.display = 'flex';
        }
        
        // 更新分數顯示
        function updateScoreDisplay() {
            circleScore.textContent = scores.circle;
            crossScore.textContent = scores.cross;
            drawScore.textContent = scores.draw;
        }
        
        // 重新開始遊戲
        function restartGame() {
            // 重置棋盤
            gameBoard = Array(9).fill('');
            
            // 重置界面
            document.querySelectorAll('.cell').forEach(cell => {
                cell.classList.remove('circle', 'cross');
                cell.innerHTML = '';
            });
            
            // 移除獲勝線
            document.querySelectorAll('.winning-line').forEach(el => el.remove());
            
            // 重置遊戲狀態
            gameActive = true;
            currentPlayer = 'circle';
            updateCurrentPlayerDisplay();
            
            // 隱藏遊戲結束畫面
            gameOverScreen.style.display = 'none';
        }
        
        // 完全重置遊戲（包括分數）
        function resetGame() {
            scores = { circle: 0, cross: 0, draw: 0 };
            localStorage.removeItem('ticTacToeScores');
            initGame();
        }
        
        // 事件監聽
        selectCircleBtn.addEventListener('click', () => selectPlayer('circle'));
        selectCrossBtn.addEventListener('click', () => selectPlayer('cross'));
        playAgainBtn.addEventListener('click', restartGame);
        resetGameBtn.addEventListener('click', initGame);
        newGameBtn.addEventListener('click', resetGame);
        
        // 初始化遊戲
        initGame();
    </script>
</body>
</html>
