<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockbuster 積木遊戲</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            color: #ddd;
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .game-container {
            position: relative;
            margin-bottom: 20px;
        }
        
        #gameCanvas {
            background-color: #111;
            border: 3px solid #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .score-container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.2);
            font-size: 1.2rem;
        }
        
        .score {
            font-weight: bold;
            color: #4CAF50;
            margin: 0 10px;
            font-size: 1.5rem;
        }
        
        .game-over {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            z-index: 10;
        }
        
        .game-over h2 {
            color: #FF4444;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #000;
        }
        
        .game-over p {
            color: white;
            font-size: 1.5rem;
            margin: 10px 0;
        }
        
        button {
            background: linear-gradient(to bottom, #4CAF50, #2E7D32);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.2s;
            font-weight: bold;
            border: 2px solid #1B5E20;
            box-shadow: 0 5px 0 #1B5E20;
        }
        
        button:hover { 
            background: linear-gradient(to bottom, #66BB6A, #388E3C);
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1B5E20;
        }
        
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        
        .key-hint {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 5px 15px;
            border-radius: 5px;
            margin: 0 5px;
            font-weight: bold;
            display: inline-block;
        }
        
        .instructions {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            max-width: 600px;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .level-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: #4CAF50;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 5;
        }
        
        .combo-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }
        
        @keyframes comboAnimation {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
        
        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
            width: 300px;
        }
        
        .mobile-controls button {
            font-size: 1.5rem;
            padding: 20px;
        }
        
        @media (max-width: 650px) {
            #gameCanvas { width: 95vw; height: 60vh; }
            h1 { font-size: 2rem; }
            .mobile-controls { display: grid; }
        }
    </style>
</head>
<body>
    <h1>Blockbuster 積木遊戲</h1>
    <p class="subtitle">用方向鍵控制球拍，反彈球擊碎積木！</p>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        
        <div class="level-indicator" id="levelIndicator">關卡: 1</div>
        
        <div class="combo-display" id="comboDisplay"></div>
        
        <div class="game-over" id="gameOverScreen">
            <h2>遊戲結束！</h2>
            <p>總分數: <span id="finalScore" class="score">0</span></p>
            <p>最高分數: <span id="highScore" class="score">0</span></p>
            <button id="playAgainBtn">再玩一次</button>
        </div>
    </div>
    
    <div class="score-container">
        分數: <span class="score" id="score">0</span> |
        球數: <span class="score" id="balls">3</span> |
        關卡: <span class="score" id="level">1</span>
    </div>
    
    <div class="mobile-controls">
        <button id="upBtn">↑</button>
        <button id="leftBtn">←</button>
        <button id="downBtn">↓</button>
        <button id="rightBtn">→</button>
    </div>
    
    <div class="instructions">
        <p>控制方式: <span class="key-hint">←</span> <span class="key-hint">→</span> 移動球拍</p>
        <p>擊碎所有積木進入下一關，每關增加新積木</p>
    </div>

    <script>
        // 取得Canvas元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 遊戲變數
        let gameRunning = false;
        let gameLoop;
        let score = 0;
        let highScore = localStorage.getItem('blockHighScore') || 0;
        let level = 1;
        let balls = 3;
        let combo = 0;
        
        // 遊戲物件
        const paddle = {
            x: canvas.width / 2 - 75,
            y: canvas.height - 30,
            width: 150,
            height: 20,
            speed: 8,
            color: '#4CAF50'
        };
        
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            radius: 10,
            dx: 5,
            dy: -5,
            speed: 5,
            color: '#FF4444'
        };
        
        // 積木陣列
        let bricks = [];
        const brickRowCount = 5;
        const brickColumnCount = 10;
        const brickWidth = 70;
        const brickHeight = 25;
        const brickPadding = 10;
        const brickOffsetTop = 60;
        const brickOffsetLeft = 35;
        
        // DOM元素
        const scoreElement = document.getElementById('score');
        const ballsElement = document.getElementById('balls');
        const levelElement = document.getElementById('level');
        const levelIndicator = document.getElementById('levelIndicator');
        const finalScoreElement = document.getElementById('finalScore');
        const highScoreElement = document.getElementById('highScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const comboDisplay = document.getElementById('comboDisplay');
        
        // 移動控制按鈕
        const upBtn = document.getElementById('upBtn');
        const downBtn = document.getElementById('downBtn');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        
        // 初始化遊戲
        function initGame() {
            // 重置遊戲狀態
            score = 0;
            level = 1;
            balls = 3;
            combo = 0;
            
            // 重置球拍
            paddle.x = canvas.width / 2 - 75;
            paddle.color = '#4CAF50';
            
            // 重置球
            resetBall();
            
            // 生成積木
            generateBricks();
            
            // 更新顯示
            scoreElement.textContent = score;
            ballsElement.textContent = balls;
            levelElement.textContent = level;
            levelIndicator.textContent = `關卡: ${level}`;
            
            // 隱藏遊戲結束畫面
            gameOverScreen.style.display = 'none';
            
            // 繪製初始畫面
            draw();
            
            // 顯示開始提示
            showStartMessage();
        }
        
        // 顯示開始提示
        function showStartMessage() {
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#4CAF50';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Blockbuster', canvas.width/2, canvas.height/2 - 50);
            
            ctx.fillStyle = 'white';
            ctx.font = '24px Arial';
            ctx.fillText('按任意鍵開始遊戲', canvas.width/2, canvas.height/2);
            ctx.fillText('使用左右方向鍵移動球拍', canvas.width/2, canvas.height/2 + 40);
            ctx.fillText('擊碎所有積木獲得分數', canvas.width/2, canvas.height/2 + 80);
        }
        
        // 生成積木
        function generateBricks() {
            bricks = [];
            const colors = [
                '#FF4444', '#FF8800', '#FFD700', 
                '#4CAF50', '#2196F3', '#9C27B0'
            ];
            
            for (let r = 0; r < brickRowCount + level - 1; r++) {
                for (let c = 0; c < brickColumnCount; c++) {
                    const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                    const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                    const colorIndex = Math.min(r, colors.length - 1);
                    
                    bricks.push({
                        x: brickX,
                        y: brickY,
                        width: brickWidth,
                        height: brickHeight,
                        color: colors[colorIndex],
                        points: (colors.length - colorIndex) * 10,
                        visible: true
                    });
                }
            }
        }
        
        // 繪製遊戲
        function draw() {
            // 清除畫布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 繪製背景
            drawBackground();
            
            // 繪製積木
            for (let brick of bricks) {
                if (brick.visible) {
                    drawBrick(brick);
                }
            }
            
            // 繪製球拍
            drawPaddle();
            
            // 繪製球
            drawBall();
            
            // 繪製UI
            drawUI();
        }
        
        // 繪製背景
        function drawBackground() {
            // 漸變背景
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 網格效果
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            
            // 垂直線
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            // 水平線
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        
        // 繪製積木
        function drawBrick(brick) {
            // 積木主體
            ctx.fillStyle = brick.color;
            ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
            
            // 積木邊框
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
            
            // 積木內陰影
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(brick.x + 2, brick.y + 2, brick.width - 4, 5);
            
            // 積木編號（視覺效果）
            ctx.fillStyle = 'white';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(brick.points, brick.x + brick.width/2, brick.y + brick.height/2 + 4);
        }
        
        // 繪製球拍
        function drawPaddle() {
            // 球拍主體
            ctx.fillStyle = paddle.color;
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            
            // 球拍邊框
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;
            ctx.strokeRect(paddle.x, paddle.y, paddle.width, paddle.height);
            
            // 球拍紋理
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            for (let i = 0; i < paddle.width; i += 10) {
                ctx.fillRect(paddle.x + i, paddle.y, 5, 5);
            }
        }
        
        // 繪製球
        function drawBall() {
            // 球主體
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ball.color;
            ctx.fill();
            
            // 球光影效果
            const gradient = ctx.createRadialGradient(
                ball.x - 3, ball.y - 3, 1,
                ball.x, ball.y, ball.radius
            );
            gradient.addColorStop(0, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(1, ball.color);
            
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // 球邊框
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        
        // 繪製UI
        function drawUI() {
            // 生命值顯示
            for (let i = 0; i < balls; i++) {
                ctx.fillStyle = '#FF4444';
                ctx.beginPath();
                ctx.arc(30 + i * 30, 30, 8, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 更新遊戲邏輯
        function update() {
            // 移動球
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // 球碰牆反彈（左右牆）
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }
            
            // 球碰牆反彈（上牆）
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }
            
            // 球碰球拍反彈
            if (ball.y + ball.radius > paddle.y &&
                ball.y - ball.radius < paddle.y + paddle.height &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width) {
                
                // 根據擊中位置調整反彈角度
                const hitPos = (ball.x - paddle.x) / paddle.width;
                ball.dx = 10 * (hitPos - 0.5);
                ball.dy = -Math.abs(ball.dy);
                
                // 擊中效果
                paddle.color = '#66BB6A';
                setTimeout(() => {
                    paddle.color = '#4CAF50';
                }, 100);
            }
            
            // 球掉落（失去生命）
            if (ball.y + ball.radius > canvas.height) {
                balls--;
                ballsElement.textContent = balls;
                
                if (balls <= 0) {
                    gameOver();
                    return;
                } else {
                    resetBall();
                    combo = 0;
                }
            }
            
            // 檢查積木碰撞
            checkBrickCollision();
            
            // 檢查是否清除所有積木
            if (bricks.every(brick => !brick.visible)) {
                levelUp();
            }
        }
        
        // 檢查積木碰撞
        function checkBrickCollision() {
            for (let brick of bricks) {
                if (brick.visible) {
                    if (ball.x + ball.radius > brick.x &&
                        ball.x - ball.radius < brick.x + brick.width &&
                        ball.y + ball.radius > brick.y &&
                        ball.y - ball.radius < brick.y + brick.height) {
                        
                        // 隱藏積木
                        brick.visible = false;
                        
                        // 增加分數
                        score += brick.points;
                        combo++;
                        
                        // 顯示連擊
                        if (combo >= 3) {
                            showCombo(combo);
                        }
                        
                        // 更新顯示
                        scoreElement.textContent = score;
                        
                        // 反彈球
                        const hitFromLeft = ball.x < brick.x;
                        const hitFromRight = ball.x > brick.x + brick.width;
                        const hitFromTop = ball.y < brick.y;
                        const hitFromBottom = ball.y > brick.y + brick.height;
                        
                        if (hitFromLeft || hitFromRight) {
                            ball.dx = -ball.dx;
                        }
                        if (hitFromTop || hitFromBottom) {
                            ball.dy = -ball.dy;
                        }
                        
                        // 打破積木效果
                        createParticles(brick.x + brick.width/2, brick.y + brick.height/2, brick.color);
                        break;
                    }
                }
            }
        }
        
        // 顯示連擊效果
        function showCombo(count) {
            comboDisplay.textContent = `${count} Combo!`;
            comboDisplay.style.animation = 'comboAnimation 1s forwards';
            
            setTimeout(() => {
                comboDisplay.style.animation = '';
            }, 1000);
        }
        
        // 創建粒子效果
        function createParticles(x, y, color) {
            // 簡化的粒子效果
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(x, y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }, i * 50);
            }
        }
        
        // 重置球
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 50;
            ball.dx = 5 * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -5;
        }
        
        // 升級
        function levelUp() {
            level++;
            balls++;
            
            // 更新顯示
            levelElement.textContent = level;
            ballsElement.textContent = balls;
            levelIndicator.textContent = `關卡: ${level}`;
            
            // 增加球速
            ball.speed += 0.5;
            ball.dx = ball.dx > 0 ? ball.speed : -ball.speed;
            ball.dy = ball.dy > 0 ? ball.speed : -ball.speed;
            
            // 生成新積木
            generateBricks();
            
            // 重置球
            resetBall();
        }
        
        // 移動球拍
        function movePaddle(direction) {
            if (!gameRunning) return;
            
            paddle.x += direction * paddle.speed;
            
            // 邊界檢查
            if (paddle.x < 0) {
                paddle.x = 0;
            }
            if (paddle.x + paddle.width > canvas.width) {
                paddle.x = canvas.width - paddle.width;
            }
        }
        
        // 開始遊戲
        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                gameLoop = setInterval(() => {
                    update();
                    draw();
                }, 1000 / 60);
            }
        }
        
        // 遊戲結束
        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            
            // 更新最高分
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('blockHighScore', highScore);
            }
            
            // 顯示遊戲結束畫面
            finalScoreElement.textContent = score;
            highScoreElement.textContent = highScore;
            gameOverScreen.style.display = 'flex';
        }
        
        // 事件監聽
        playAgainBtn.addEventListener('click', () => {
            initGame();
            startGame();
        });
        
        // 鍵盤控制
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (!gameRunning && e.key) {
                startGame();
            }
            
            if (e.key === 'ArrowLeft') {
                movePaddle(-1);
            }
            if (e.key === 'ArrowRight') {
                movePaddle(1);
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // 移動控制按鈕事件
        leftBtn.addEventListener('mousedown', () => movePaddle(-1));
        leftBtn.addEventListener('touchstart', () => movePaddle(-1));
        
        rightBtn.addEventListener('mousedown', () => movePaddle(1));
        rightBtn.addEventListener('touchstart', () => movePaddle(1));
        
        // 點擊開始遊戲
        canvas.addEventListener('click', () => {
            if (!gameRunning) {
                startGame();
            }
        });
        
        // 初始化遊戲
        initGame();
    </script>
</body>
</html>
